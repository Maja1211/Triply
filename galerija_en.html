<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triply | Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index_en.html">
        <img src="triply_logo.png" alt="Triply logo" height="40" />
        <span class="fw-bold logo-text">Triply</span>
      </a>
      <div class="d-flex align-items-center order-lg-2 ms-auto gap-2">
        <button id="theme-toggle" class="theme-btn">🌙</button>
        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle lang-btn" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="currentLang">EN</span>
          </button>
          <ul class="dropdown-menu" aria-labelledby="langDropdown">
            <li><a class="dropdown-item" href="#" data-lang="sr">Srpski</a></li>
            <li><a class="dropdown-item" href="#" data-lang="en">English</a></li>
          </ul>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-lg-center gap-3">
          <li class="nav-item"><a href="index_en.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="aranzmani_en.html" class="nav-link">Arrangements</a></li>
          <li class="nav-item"><a href="galerija_en.html" class="nav-link active">Gallery</a></li>
          <li class="nav-item"><a href="moj_nalog_en.html" class="nav-link">My Account</a></li>
          <li class="nav-item"><a href="o_nama_en.html" class="nav-link">About Us</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="text-center mt-5">
    <div class="container mt-3 mb-4">
      <div class="row justify-content-center g-3">
        <div class="col-md-4">
          <input type="text" id="searchInput" class="form-control" placeholder="Search destinations..." />
        </div>
        <div class="col-md-3">
          <select id="categoryFilter" class="form-select">
            <option value="all">All categories</option>
            <option value="evropski">European Cities</option>
            <option value="leto">Summer 2025</option>
            <option value="zima">Winter 2025</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <section class="galerija container mb-5">
    <div class="row g-4" id="destinationContainer"></div>
  </section>

  <footer>
    <p>Copyright 2025, Jovana Čeganjac and Maja Špirto, University of Belgrade - School of Electrical Engineering</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="galerija_en.js"></script>


  <script>
    const toggleBtn = document.getElementById("theme-toggle");
    const currentTheme = localStorage.getItem("theme");
    if (currentTheme) {
      document.documentElement.setAttribute("data-theme", currentTheme);
      toggleBtn.textContent = currentTheme === "light" ? "🌞" : "🌙";
    }
    toggleBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const newTheme = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("theme", newTheme);
      toggleBtn.textContent = newTheme === "light" ? "🌞" : "🌙";
    });

    const currentLang = localStorage.getItem('lang') || 'en';
    document.getElementById('currentLang').textContent = currentLang.toUpperCase();
    const isEnglishPage = window.location.href.includes('_en.html');
    if ((currentLang === 'en' && !isEnglishPage) || (currentLang === 'sr' && isEnglishPage)) {
      const newUrl = currentLang === 'en'
        ? window.location.href.replace('.html', '_en.html')
        : window.location.href.replace('_en.html', '.html');
      window.location.href = newUrl;
    }
    document.querySelectorAll('.dropdown-item[data-lang]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const newLang = e.target.getAttribute('data-lang');
        localStorage.setItem('lang', newLang);
        const newUrl = newLang === 'en'
          ? window.location.href.replace('.html', '_en.html')
          : window.location.href.replace('_en.html', '.html');
        window.location.href = newUrl;
      });
    });
  </script>
</body>
</html>
